[project]
name = "penplus-pipeline"
version = "1.0.0"
description = "Parses PEN-Plus quarterly country returns into the regional dashboard's static JSON bundle."
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
penplus-pipeline = "penplus_pipeline.run:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/penplus_pipeline"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
