name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - name: Bundle must be the public export (no facility identity, no simulated return)
        run: |
          python3 - <<'PY'
          import json
          man = json.load(open("public/data/manifest.json"))
          assert man.get("public") is True, \
              "site/public/data/manifest.json is not a --public export -- refusing to deploy"
          fac = json.load(open("public/data/facilities.json"))
          named = [f["facility_id"] for f in fac["rows"] if f.get("name")]
          assert not named, f"facility identity present in the public bundle: {named}"
          print("public export check OK")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
