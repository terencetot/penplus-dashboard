name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    name: Pipeline (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src
      - run: python -m pytest -v

  site:
    name: Site (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - name: Bundle must be the public export (no facility identity, no simulated return)
        run: |
          python3 - <<'PY'
          import json, sys
          man = json.load(open("public/data/manifest.json"))
          assert man.get("public") is True, \
              "site/public/data/manifest.json is not a --public export -- rerun " \
              "run.py --transform --export --public before committing the bundle"
          fac = json.load(open("public/data/facilities.json"))
          named = [f["facility_id"] for f in fac["rows"] if f.get("name")]
          assert not named, f"facility identity present in the public bundle: {named}"
          print("public export check OK")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check "src/**/*.ts"
      - run: npm test
      - run: npm run build
